<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経済指標予測ダッシュボード</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        header h1 {
            font-size: 2.8em;
            margin-bottom: 12px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.15em;
            opacity: 0.9;
        }

        .report-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            overflow: hidden;
            margin-bottom: 20px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .report-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 16px 48px rgba(0,0,0,0.3);
        }

        .report-card a {
            display: flex;
            align-items: center;
            padding: 28px 32px;
            text-decoration: none;
            color: inherit;
        }

        .report-icon {
            font-size: 2.8em;
            margin-right: 24px;
            flex-shrink: 0;
        }

        .report-info {
            flex: 1;
        }

        .report-info h2 {
            font-size: 1.4em;
            color: #333;
            margin-bottom: 6px;
        }

        .report-info .meta {
            font-size: 0.9em;
            color: #888;
            margin-bottom: 10px;
        }

        .report-info .tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .tag-baseline { background: #dbeafe; color: #1d4ed8; }
        .tag-optimistic { background: #dcfce7; color: #15803d; }
        .tag-risk { background: #fee2e2; color: #b91c1c; }
        .tag-chart { background: #f3e8ff; color: #7c3aed; }

        .report-arrow {
            font-size: 1.6em;
            color: #667eea;
            margin-left: 16px;
            flex-shrink: 0;
        }

        .section-title {
            color: white;
            font-size: 1em;
            font-weight: 600;
            opacity: 0.8;
            margin-bottom: 12px;
            margin-top: 32px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 0.85em;
            margin-top: 40px;
        }

        .qr-section {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
            padding: 32px;
            text-align: center;
            margin-bottom: 20px;
        }

        .qr-section h3 {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 6px;
        }

        .qr-section .qr-url {
            font-size: 0.82em;
            color: #888;
            margin-bottom: 20px;
            word-break: break-all;
        }

        #qrcode {
            display: inline-block;
            padding: 12px;
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 経済指標予測</h1>
            <p>FRED API データによるマルチシナリオ経済分析</p>
        </header>

        <div class="section-title">最新レポート</div>

        <div class="report-card">
            <a href="economic_report_20260322_072644.html">
                <div class="report-icon">📈</div>
                <div class="report-info">
                    <h2>経済指標予測レポート &mdash; 複合シナリオ分析</h2>
                    <div class="meta">生成日時: 2026年3月22日 &nbsp;|&nbsp; FRED API データ使用</div>
                    <div class="tags">
                        <span class="tag tag-baseline">ベースライン</span>
                        <span class="tag tag-optimistic">楽観的シナリオ</span>
                        <span class="tag tag-risk">リスクシナリオ</span>
                        <span class="tag tag-chart">4グラフ</span>
                    </div>
                </div>
                <div class="report-arrow">›</div>
            </a>
        </div>

        <div class="section-title">公開サイト QRコード</div>

        <div class="qr-section">
            <h3>📱 スマートフォンで読み取り</h3>
            <div class="qr-url">https://imasatoinfomation-rgb.github.io/financial/</div>
            <div id="qrcode"></div>
        </div>

        <footer>
            &copy; 2026 Economic Forecast Dashboard &nbsp;|&nbsp; Powered by FRED API &amp; Chart.js
        </footer>

        <script>
            new QRCode(document.getElementById('qrcode'), {
                text: 'https://imasatoinfomation-rgb.github.io/financial/',
                width: 200,
                height: 200,
                colorDark: '#333333',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.M
            });
        </script>
    </div>
</body>
</html>
